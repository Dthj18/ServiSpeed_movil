name: CI

on:
  push:
    branches: [main, develop, test-front]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones viejas de la misma rama si haces push de nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

  typecheck:
    name: Tipos (TypeScript)
    runs-on: ubuntu-latest
    # Informativo: TypeScript 6 puede marcar errores nuevos
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: tsc
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Mientras los tests de tu compañero se arreglan, no bloquean el pipeline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Tests
        run: npm test -- --ci
