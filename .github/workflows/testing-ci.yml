name: Pruebas de CI para Testing

# 1. EL DISPARADOR (Cuándo correr)
# Se ejecutará en cada Pull Request que apunte a la rama 'testing'
on:
  pull_request:
    branches:
      - testing

jobs:
  # 2. LAS TAREAS (Qué hacer)
  build-and-test:
    # Usará una máquina virtual de Ubuntu (Linux)
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código de tu Pull Request
      - name: Checkout código
        uses: actions/checkout@v4

      # Paso 2: Configurar Node.js (el "motor" de tu app)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Puedes cambiar esto a 18, 20, etc.
          cache: 'npm' # Habilita el caché para 'npm'

      # Paso 3: Instalar las dependencias
      - name: Instalar dependencias (npm install)
        run: npm install

      # Paso 4: Correr el Linter (Revisa tu estilo de código)
      - name: Correr Linter (npm run lint)
        run: npm run lint

      # Paso 5: Correr las Pruebas (npm run test)
      - name: Correr Pruebas (npm run test)
        run: npm run test
